[tool.poetry]
name = "z3-api"
version = "2.15.0"
description = "z3 API for FM Playground"
authors = ["Soaibuzzaman <soaibuzzaman@uni-weimar.de>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = {extras = ["standard"], version = "^0.137.1"}
httpx = "^0.27.0"
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"
requests = "^2.32.3"
uvicorn = "^0.30.5"
python-dotenv = "^1.0.1"
redis = "^5.0.8"
python-redis-cache = "^4.0.1"
z3-solver = "^4.15.3.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
