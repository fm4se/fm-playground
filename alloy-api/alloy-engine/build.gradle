plugins {
    id 'java-library'
}

group = 'de.buw'
version = '0.0.1'

repositories {
    mavenCentral()
}

// Compile against the Java 17 API regardless of the JDK running Gradle, so the bytecode is
// consumable by the Spring Boot app and by TeaVM alike.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

def alloyDistJar = rootProject.file('lib/org.alloytools.alloy.dist.jar')

dependencies {
    // Alloy Analyzer + Pardinus/Kodkod + SAT4J + the redundancy checker (bytecode only).
    api files(alloyDistJar)
    api 'org.json:json:20240303'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ---------------------------------------------------------------------------------------------
// Alloy standard library (util/ordering, util/integer, ...) as generated Java source.
//
// The analyzer normally reads these modules from the JAR or the file system. Neither is
// reliably available inside the browser, so we embed them as string constants and hand them to
// the parser up front. The same code path is used on the server, which keeps both in sync.
// ---------------------------------------------------------------------------------------------
def stdlibOutput = layout.buildDirectory.dir('generated/sources/alloyStdlib/java/main')

def generateAlloyStdlib = tasks.register('generateAlloyStdlib', GenerateAlloyStdlib) {
    distJar = alloyDistJar
    outputDir = stdlibOutput
}

sourceSets.main.java.srcDir(generateAlloyStdlib)

tasks.named('test') {
    useJUnitPlatform()
    maxHeapSize = '2g'
    // Book example models shipped inside the Alloy JAR are used as parity fixtures.
    systemProperty 'alloy.distJar', alloyDistJar.absolutePath
}

abstract class GenerateAlloyStdlib extends DefaultTask {
    @InputFile
    abstract RegularFileProperty getDistJar()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    static String javaLiteral(String s) {
        def sb = new StringBuilder('"')
        s.each { String ch ->
            char c = ch.charAt(0)
            switch (c) {
                case '\\': sb.append('\\\\'); break
                case '"': sb.append('\\"'); break
                case '\n': sb.append('\\n'); break
                case '\r': sb.append('\\r'); break
                case '\t': sb.append('\\t'); break
                default:
                    if (c < (char) 0x20 || c > (char) 0x7e) {
                        sb.append(String.format('\\u%04x', (int) c))
                    } else {
                        sb.append(c)
                    }
            }
        }
        sb.append('"')
        return sb.toString()
    }

    @TaskAction
    void generate() {
        def modules = new TreeMap<String, String>()
        new java.util.zip.ZipFile(distJar.get().asFile).withCloseable { zip ->
            zip.entries().each { entry ->
                def name = entry.name
                if (!entry.directory && name.startsWith('models/util/') && name.endsWith('.als')) {
                    def moduleName = name.substring('models/'.length(), name.length() - '.als'.length())
                    modules[moduleName] = zip.getInputStream(entry).getText('UTF-8')
                }
            }
        }
        if (modules.isEmpty()) {
            throw new GradleException("No models/util/*.als found in ${distJar.get().asFile}")
        }

        def pkgDir = new File(outputDir.get().asFile, 'de/buw/fmp/alloy/engine/stdlib')
        pkgDir.deleteDir()
        pkgDir.mkdirs()

        def src = new StringBuilder()
        src << 'package de.buw.fmp.alloy.engine.stdlib;\n\n'
        src << 'import java.util.Collections;\nimport java.util.LinkedHashMap;\nimport java.util.Map;\n\n'
        src << '/** GENERATED by the generateAlloyStdlib Gradle task. Do not edit. */\n'
        src << 'public final class AlloyStdlib {\n'
        src << '  private static final Map<String, String> MODULES;\n\n'
        src << '  static {\n'
        src << '    Map<String, String> m = new LinkedHashMap<>();\n'
        modules.each { k, v ->
            src << "    m.put(${GenerateAlloyStdlib.javaLiteral(k)}, ${GenerateAlloyStdlib.javaLiteral(v)});\n"
        }
        src << '    MODULES = Collections.unmodifiableMap(m);\n'
        src << '  }\n\n'
        src << '  private AlloyStdlib() {}\n\n'
        src << '  /** Module path (for example {@code util/ordering}) to Alloy source text. */\n'
        src << '  public static Map<String, String> modules() {\n'
        src << '    return MODULES;\n'
        src << '  }\n'
        src << '}\n'
        new File(pkgDir, 'AlloyStdlib.java').setText(src.toString(), 'UTF-8')
    }
}
